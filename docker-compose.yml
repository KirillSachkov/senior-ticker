services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: senior_ticker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d senior_ticker"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data

  demo-api:
    build:
      context: .
      dockerfile: advanced/src/SeniorTicker.DemoHost/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=senior_ticker;Username=postgres;Password=postgres
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  demo-ui:
    build:
      context: frontend/senior-ticker-demo
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - demo-api

volumes:
  demo-postgres-data:
